<svg viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <style>
      .cloud { fill: #ffffff; opacity: 0.18; }
      .cloud1 { animation: drift1 22s linear infinite; }
      .cloud2 { animation: drift2 32s linear infinite; }
      .cloud3 { animation: drift3 40s linear infinite; }
      @keyframes drift1 { from { transform: translateX(-150px); } to { transform: translateX(1050px); } }
      @keyframes drift2 { from { transform: translateX(-200px); } to { transform: translateX(1100px); } }
      @keyframes drift3 { from { transform: translateX(-100px); } to { transform: translateX(1000px); } }

      .wave-back { animation: waveMove 9s linear infinite; }
      .wave-front { animation: waveMove 6s linear infinite reverse; }
      @keyframes waveMove { from { transform: translateX(0); } to { transform: translateX(-300px); } }

      .whale { animation: bob 3s ease-in-out infinite alternate; }
      @keyframes bob { from { transform: translateY(0px); } to { transform: translateY(-8px); } }

      .title { opacity: 0; animation: fadeUp 1s ease forwards; animation-delay: 0.2s; }
      .subtitle { opacity: 0; animation: fadeUp 1s ease forwards; animation-delay: 0.9s; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>

  <rect width="900" height="250" fill="url(#sky)"/>

  <!-- clouds -->
  <g class="cloud cloud1"><ellipse cx="100" cy="50" rx="40" ry="15"/><ellipse cx="130" cy="45" rx="28" ry="12"/></g>
  <g class="cloud cloud2"><ellipse cx="400" cy="35" rx="50" ry="18"/><ellipse cx="440" cy="30" rx="34" ry="14"/></g>
  <g class="cloud cloud3"><ellipse cx="650" cy="60" rx="35" ry="13"/><ellipse cx="682" cy="55" rx="24" ry="10"/></g>

  <!-- text -->
  <text class="title" x="40" y="100" font-family="monospace" font-size="42" font-weight="700" fill="#ffffff">Fawwaz</text>
  <text class="subtitle" x="40" y="135" font-family="monospace" font-size="18" fill="#20C20E">DevOps &amp; Cloud Engineer</text>

  <!-- waves (wavelength = 150, translated by exactly 300 = seamless loop) -->
  <path class="wave-back" d="M0,190 Q37.5,175 75,190 T150,190 T225,190 T300,190 T375,190 T450,190 T525,190 T600,190 T675,190 T750,190 T825,190 T900,190 T975,190 T1050,190 T1125,190 T1200,190 V250 H0 Z" fill="#134e5e" opacity="0.6"/>
  <path class="wave-front" d="M0,202 Q37.5,187 75,202 T150,202 T225,202 T300,202 T375,202 T450,202 T525,202 T600,202 T675,202 T750,202 T825,202 T900,202 T975,202 T1050,202 T1125,202 T1200,202 V250 H0 Z" fill="#0f2027" opacity="0.85"/>

  <!-- docker whale -->
  <g class="whale" transform="translate(660,145)">
    <path d="M0,32 C8,10 45,-2 78,8 C96,14 108,26 108,32 C108,42 86,47 64,47 L12,47 C2,47 -5,40 0,32 Z" fill="#2496ED"/>
    <rect x="18" y="-2" width="15" height="15" fill="#2496ED" stroke="#0f2027" stroke-width="1"/>
    <rect x="34" y="-2" width="15" height="15" fill="#2496ED" stroke="#0f2027" stroke-width="1"/>
    <rect x="50" y="-2" width="15" height="15" fill="#2496ED" stroke="#0f2027" stroke-width="1"/>
    <rect x="34" y="-17" width="15" height="15" fill="#2496ED" stroke="#0f2027" stroke-width="1"/>
    <circle cx="98" cy="28" r="2.5" fill="#0f2027"/>
  </g>
</svg>
